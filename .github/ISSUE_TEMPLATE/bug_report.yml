name: Bug report
description: Something behaves differently from how it is documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this involves a shell action or the control API, please email rather than
        opening a public issue — see the security note in CONTRIBUTING.md.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: dropdown
    id: channel
    attributes:
      label: Which build
      description: Settings › General › About this build tells you.
      options:
        - Direct download
        - App Store
        - Built from source
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.5, Apple Silicon"
    validations:
      required: true

  - type: input
    id: skin
    attributes:
      label: Skin and config in use
      description: Both are named in Settings. Say if either is one you wrote.
      placeholder: "Classic '97 / Developer"

  - type: textarea
    id: manifest
    attributes:
      label: The skin or config involved
      description: If it is one of yours, pasting it here usually settles the question.
      render: json
